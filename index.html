<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>披萨妙妙屋</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #fff8e7, #ffe4c4);
      text-align: center;
    }

    h1 {
      color: #d2691e;
      animation: float 2s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .pizza-img {
      width: 320px;
      max-width: 90%;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      transition: transform 0.4s;
    }

    .pizza-img:hover {
      transform: scale(1.08) rotate(2deg);
    }

    video {
      width: 480px;
      max-width: 90%;
      border-radius: 16px;
      margin: 16px 0;
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 999px;
      background: #ff7a00;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }

    button:hover {
      background: #e85d00;
      transform: translateY(-2px);
    }

    #msg {
      font-size: 20px;
      color: #8b4513;
      min-height: 1.5em;
    }
  </style>
</head>

<body>
  <h1>欢迎来到披萨妙妙屋</h1>

  <img class="pizza-img" src="pizza.jpg" alt="美味披萨">

  <video controls muted loop playsinline poster="cover.jpg">
    <source src="pizza.mp4" type="video/mp4">
    你的浏览器不支持视频播放。
  </video>

  <button onclick="showMessage()">点我订餐</button>
  <p id="msg"></p>

  <script>
    function showMessage() {
      document.getElementById("msg").textContent = "欢迎光临，披萨马上来！";
    }
  </script>
</body>
</html>
